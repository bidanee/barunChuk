name: BarunChuk CI/CD Pipeline 

on:
  push:
    branches:
      - main 
  workflow_dispatch: # GitHub UI에서 수동 실행 허용

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend 
          file: ./frontend/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/barunchuk-frontend:latest 
          platforms: linux/amd64

      - name: Build and push Node.js Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/server 
          file: ./backend/server/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/barunchuk-backend-node:latest 
          platforms: linux/amd64

      - name: Build and push FastAPI Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/fastapi 
          file: ./backend/fastapi/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/barunchuk-backend-python:latest 
          platforms: linux/amd64

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.1 
        with:
          host: ${{ secrets.HOST }} 
          username: ${{ secrets.USERNAME }} 
          key: ${{ secrets.KEY }} 
          port: ${{ secrets.PORT }} 
          script: |
            # EC2 서버에 로그인 후 실행할 명령들
            # 1. 배포할 프로젝트 디렉토리로 이동
            #    이 디렉토리에는 배포용 docker-compose.yml 파일 존재 해야함
            #    로컬 개발용 docker-compose.yml과 다르게, 볼륨 마운트는 제거
            cd /home/${{ secrets.USER }}/barunChuk # EC2의 실제 배포 경로에 맞게 조정

            # 2. Docker Hub 로그인 (EC2에서도 이미지 pull을 위해 필요)
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

            # 3. 최신 Docker 이미지들을 Pull
            #    docker-compose.yml에 정의된 서비스 이름(frontend, backend-node, backend-python) 사용
            docker-compose pull frontend backend-node backend-python 
            # db는 Docker Hub에서 공식 이미지 pull

            # 4. Docker Compose 서비스 재시작 (새로운 이미지로)
            docker-compose up -d --remove-orphans

            # 5. 불필요한 Docker 이미지 정리 (디스크 공간 확보)
            docker image prune -f

            echo "Deployment completed on EC2."
